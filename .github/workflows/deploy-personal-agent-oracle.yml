name: Deploy Personal Agent to Oracle

on:
  push:
    branches: [cursor/personal-agent-task-scheduler-64cf, cursor/bot-restart-fix-64cf, cursor/agent-tutor-modules-64cf, main]
    paths:
      - 'personal-agent/**'
      - 'src/app/api/google/**'
      - '.github/workflows/deploy-personal-agent-oracle.yml'
  workflow_dispatch:

concurrency:
  group: deploy-personal-agent-oracle
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ORACLE_SSH_KEY }}

      - name: Add Oracle host key
        run: |
          HOST="${{ secrets.ORACLE_HOST || '140.84.183.154' }}"
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Create production .env
        env:
          BOT_TOKEN: ${{ secrets.PERSONAL_AGENT_BOT_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          PERSONAL_AGENT_INTERNAL_SECRET: ${{ secrets.PERSONAL_AGENT_INTERNAL_SECRET || 'personal-agent-internal-2026' }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          YANDEX_MAPS_API_KEY: ${{ secrets.YANDEX_MAPS_API_KEY }}
          DGIS_API_KEY: ${{ secrets.DGIS_API_KEY }}
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "::error::Set PERSONAL_AGENT_BOT_TOKEN in GitHub Secrets (токен @mychatbot7_bot, отдельно от language-tutor BOT_TOKEN)"
            exit 1
          fi
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::warning::OPENAI_API_KEY empty — voice and AI disabled"
          fi
          if [ -z "$GOOGLE_CLIENT_ID" ] || [ -z "$GOOGLE_CLIENT_SECRET" ]; then
            echo "::error::GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET must be set in GitHub Secrets"
            exit 1
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path

          def line(key: str, value: str) -> str:
              return f"{key}={value}"

          env = {
              "BOT_TOKEN": os.environ["BOT_TOKEN"],
              "OPENAI_API_KEY": os.environ.get("OPENAI_API_KEY", ""),
              "OPENAI_MODEL": "gpt-4o-mini",
              "OPENAI_WHISPER_MODEL": "whisper-1",
              "OPENAI_TTS_MODEL": "tts-1",
              "OPENAI_TTS_VOICE": "nova",
              "ANTHROPIC_API_KEY": os.environ.get("ANTHROPIC_API_KEY", ""),
              "ANTHROPIC_MODEL": "claude-sonnet-4-5-20250929",
              "DEFAULT_TIMEZONE": "America/Cancun",
              "DATABASE_URL": "sqlite+aiosqlite:///./data/agent.db",
              "SCHEDULER_DATABASE_URL": "sqlite:///./data/scheduler.db",
              "TTS_VOICE": "ru-RU-DmitryNeural",
              "ENVIRONMENT": "production",
              "BOT_BUILD_ID": os.environ.get("GITHUB_SHA", "manual")[:12],
              "GOOGLE_CLIENT_ID": os.environ["GOOGLE_CLIENT_ID"],
              "GOOGLE_CLIENT_SECRET": os.environ["GOOGLE_CLIENT_SECRET"],
              "GOOGLE_REDIRECT_URI": "https://ai-agency-drab.vercel.app/api/google/oauth/callback",
              "OAUTH_SERVER_PORT": "8080",
              "OAUTH_HOST_PORT": "8081",
              "PERSONAL_AGENT_INTERNAL_SECRET": os.environ.get(
                  "PERSONAL_AGENT_INTERNAL_SECRET", "personal-agent-internal-2026"
              ),
              "TWILIO_ACCOUNT_SID": os.environ.get("TWILIO_ACCOUNT_SID", ""),
              "TWILIO_AUTH_TOKEN": os.environ.get("TWILIO_AUTH_TOKEN", ""),
              "TWILIO_FROM_NUMBER": os.environ.get("TWILIO_FROM_NUMBER", ""),
              "GOOGLE_MAPS_API_KEY": os.environ.get("GOOGLE_MAPS_API_KEY", ""),
              "YANDEX_MAPS_API_KEY": os.environ.get("YANDEX_MAPS_API_KEY", ""),
              "DGIS_API_KEY": os.environ.get("DGIS_API_KEY", ""),
          }
          Path("personal-agent/.env").write_text(
              "\n".join(line(k, v) for k, v in env.items()) + "\n",
              encoding="utf-8",
          )
          print(f"GOOGLE_CLIENT_ID length: {len(env['GOOGLE_CLIENT_ID'])}")
          print(f"GOOGLE_CLIENT_SECRET length: {len(env['GOOGLE_CLIENT_SECRET'])}")
          PY

      - name: Deploy to Oracle
        run: |
          HOST="${{ secrets.ORACLE_HOST || '140.84.183.154' }}"
          USER="${{ secrets.ORACLE_SSH_USER || 'ubuntu' }}"
          REMOTE_DIR="/opt/personal-agent"

          tar -czf /tmp/personal-agent-deploy.tar.gz \
            --exclude=__pycache__ --exclude=.venv --exclude=.git --exclude=data \
            -C personal-agent .

          scp -o StrictHostKeyChecking=no /tmp/personal-agent-deploy.tar.gz "$USER@$HOST:/tmp/personal-agent-deploy.tar.gz"
          ssh -o StrictHostKeyChecking=no "$USER@$HOST" "sudo mkdir -p $REMOTE_DIR && sudo chown -R \$(whoami):\$(whoami) $REMOTE_DIR"
          scp -o StrictHostKeyChecking=no personal-agent/.env "$USER@$HOST:$REMOTE_DIR/.env"

          ssh -o StrictHostKeyChecking=no "$USER@$HOST" "
            cd $REMOTE_DIR
            tar -xzf /tmp/personal-agent-deploy.tar.gz
            rm -f /tmp/personal-agent-deploy.tar.gz
            chmod +x oracle-redeploy.sh oracle-setup.sh
            ./oracle-redeploy.sh
          "

      - name: Fail if bot container not running
        run: |
          HOST="${{ secrets.ORACLE_HOST || '140.84.183.154' }}"
          USER="${{ secrets.ORACLE_SSH_USER || 'ubuntu' }}"
          ssh -o StrictHostKeyChecking=no "${USER}@${HOST}" '
            STATUS=$(sudo docker inspect -f "{{.State.Status}}" personal-agent-bot 2>/dev/null || echo missing)
            if [ "$STATUS" != "running" ]; then
              echo "Bot container status: $STATUS"
              sudo docker logs personal-agent-bot --tail 80 2>&1 || true
              exit 1
            fi
            echo "Bot container running"
          '

      - name: Verify deployed timezone code
        run: |
          HOST="${{ secrets.ORACLE_HOST || '140.84.183.154' }}"
          USER="${{ secrets.ORACLE_SSH_USER || 'ubuntu' }}"
          ssh -o StrictHostKeyChecking=no "${USER}@${HOST}" '
            if ! grep -q "extract_timezone_argument" /opt/personal-agent/bot/handlers/tasks.py; then
              echo "::error::Server still has old timezone handler"
              exit 1
            fi
            BUILD_ID=$(grep "^BOT_BUILD_ID=" /opt/personal-agent/.env | cut -d= -f2)
            echo "Deployed BOT_BUILD_ID=$BUILD_ID"
          '

      - name: Open OAuth port on VM firewall
        run: |
          HOST="${{ secrets.ORACLE_HOST || '140.84.183.154' }}"
          USER="${{ secrets.ORACLE_SSH_USER || 'ubuntu' }}"
          ssh -o StrictHostKeyChecking=no "${USER}@${HOST}" '
            if command -v ufw >/dev/null; then sudo ufw allow 8081/tcp || true; fi
            sudo iptables -C INPUT -p tcp --dport 8081 -j ACCEPT 2>/dev/null || \
              sudo iptables -I INPUT -p tcp --dport 8081 -j ACCEPT || true
          '

      - name: Verify OAuth port 8081
        run: |
          HOST="${{ secrets.ORACLE_HOST || '140.84.183.154' }}"
          USER="${{ secrets.ORACLE_SSH_USER || 'ubuntu' }}"
          ssh -o StrictHostKeyChecking=no "${USER}@${HOST}" '
            echo "--- localhost:8081 from VM ---"
            curl -sS --connect-timeout 5 http://127.0.0.1:8081/health || echo "local curl failed"
            echo
            echo "--- public IP from VM ---"
            curl -sS --connect-timeout 5 http://140.84.183.154:8081/health || echo "public curl failed"
            echo
            echo "--- listening ports ---"
            sudo ss -tlnp | grep -E ":808[01]" || true
          '

      - name: Bot logs after deploy
        run: |
          HOST="${{ secrets.ORACLE_HOST || '140.84.183.154' }}"
          USER="${{ secrets.ORACLE_SSH_USER || 'ubuntu' }}"
          ssh -o StrictHostKeyChecking=no "${USER}@${HOST}" "
            cd /opt/personal-agent
            echo '--- Google env on server (lengths only) ---'
            python3 - <<'PY'
          from pathlib import Path
          vals = {}
          for raw in Path('.env').read_text(encoding='utf-8').splitlines():
              if '=' in raw and raw.split('=', 1)[0] in {'GOOGLE_CLIENT_ID', 'GOOGLE_CLIENT_SECRET'}:
                  k, v = raw.split('=', 1)
                  vals[k] = len(v)
          print('GOOGLE_CLIENT_ID chars:', vals.get('GOOGLE_CLIENT_ID', 0))
          print('GOOGLE_CLIENT_SECRET chars:', vals.get('GOOGLE_CLIENT_SECRET', 0))
          PY
            sudo docker compose -f docker-compose.prod.yml ps
            echo '--- waiting for bot polling (up to 90s) ---'
            for i in 1 2 3 4 5 6 7 8 9; do
              if sudo docker compose -f docker-compose.prod.yml logs bot 2>&1 | grep -q 'Start polling'; then
                echo 'Bot polling confirmed'
                break
              fi
              echo \"attempt \$i: no polling yet, waiting 10s...\"
              sleep 10
            done
            if ! sudo docker compose -f docker-compose.prod.yml logs bot 2>&1 | grep -q 'Start polling'; then
              echo 'Bot not polling — restarting container'
              sudo docker compose -f docker-compose.prod.yml restart bot
              sleep 15
            fi
            sudo docker compose -f docker-compose.prod.yml logs bot --tail 30
            sudo docker compose -f docker-compose.prod.yml logs oauth --tail 10
            if ! sudo docker compose -f docker-compose.prod.yml logs bot 2>&1 | grep -q 'Start polling'; then
              echo '::error::Bot failed to start polling after deploy'
              exit 1
            fi
          "
