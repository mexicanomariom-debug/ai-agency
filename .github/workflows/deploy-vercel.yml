name: Deploy Webapp to Vercel

on:
  push:
    branches: [main]
    paths:
      - 'language-tutor/webapp/**'
      - '.github/workflows/deploy-vercel.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and build
        working-directory: language-tutor/webapp
        run: |
          npm ci
          npm run build

      - name: Deploy to Vercel
        working-directory: language-tutor/webapp
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
            npx vercel build --prod --token="$VERCEL_TOKEN"
            npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
          elif [ -n "$VERCEL_DEPLOY_HOOK" ]; then
            echo "Triggering Vercel deploy hook..."
            curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
          else
            echo "::warning::No VERCEL_TOKEN or VERCEL_DEPLOY_HOOK — webapp-bay will not redeploy"
            echo "Add VERCEL_DEPLOY_HOOK from Vercel → webapp-bay → Settings → Git → Deploy Hooks"
          fi
