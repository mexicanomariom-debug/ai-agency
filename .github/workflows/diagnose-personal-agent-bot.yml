name: Diagnose Personal Agent Bot

on:
  workflow_dispatch:
  push:
    branches: [cursor/personal-agent-task-scheduler-64cf]
    paths:
      - '.github/workflows/diagnose-personal-agent-bot.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ORACLE_SSH_KEY }}

      - name: Deep diagnose and fix personal-agent bot
        run: |
          HOST="${{ secrets.ORACLE_HOST || '140.84.183.154' }}"
          USER="${{ secrets.ORACLE_SSH_USER || 'ubuntu' }}"
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -o StrictHostKeyChecking=no "${USER}@${HOST}" "bash -s" <<'REMOTE'
          set -e
          cd /opt/personal-agent

          echo "=== CONTAINERS ==="
          sudo docker compose -f docker-compose.prod.yml ps -a

          TOKEN=$(grep '^BOT_TOKEN=' .env | cut -d= -f2-)
          if [ -z "$TOKEN" ]; then
            echo "ERROR: BOT_TOKEN missing"
            exit 1
          fi

          echo "=== TELEGRAM getMe ==="
          curl -sS "https://api.telegram.org/bot${TOKEN}/getMe" | head -c 300
          echo

          echo "=== TELEGRAM getWebhookInfo ==="
          curl -sS "https://api.telegram.org/bot${TOKEN}/getWebhookInfo"
          echo

          echo "=== DELETE WEBHOOK (force polling) ==="
          curl -sS "https://api.telegram.org/bot${TOKEN}/deleteWebhook?drop_pending_updates=true"
          echo

          echo "=== PENDING UPDATES (stop bot first to avoid 409 with polling) ==="
          sudo docker compose -f docker-compose.prod.yml stop bot
          sleep 3
          curl -sS "https://api.telegram.org/bot${TOKEN}/getUpdates?limit=3&timeout=1" | head -c 800
          echo

          echo "=== RECENT ERRORS IN LOGS ==="
          sudo docker compose -f docker-compose.prod.yml logs bot --tail 300 2>&1 \
            | grep -iE "error|exception|conflict|traceback|handled|polling stopped" || echo "(no errors matched)"

          echo "=== LAST 30 LOG LINES ==="
          sudo docker compose -f docker-compose.prod.yml logs bot --tail 30

          echo "=== ALL personal-agent containers on host ==="
          sudo docker ps -a | grep -E "personal-agent|CONTAINER" || true

          echo "=== STOP ALL personal-agent bots, wait, start single instance ==="
          sudo docker stop personal-agent-bot 2>/dev/null || true
          sudo docker rm -f personal-agent-bot 2>/dev/null || true
          sleep 8
          sudo docker compose -f docker-compose.prod.yml up -d --force-recreate bot
          sleep 20

          echo "=== AFTER RECREATE ==="
          sudo docker compose -f docker-compose.prod.yml ps -a
          sudo docker compose -f docker-compose.prod.yml logs bot --tail 25

          if sudo docker compose -f docker-compose.prod.yml logs bot 2>&1 | grep -qi "TelegramConflictError"; then
            echo "ERROR: TelegramConflictError in logs — @mychatbot7_bot runs elsewhere too (old server / PC start-bot.bat)"
            exit 1
          fi
          if ! sudo docker compose -f docker-compose.prod.yml logs bot 2>&1 | grep -q "Start polling"; then
            echo "ERROR: Bot not polling"
            exit 1
          fi
          echo "DIAGNOSE OK"
          REMOTE
