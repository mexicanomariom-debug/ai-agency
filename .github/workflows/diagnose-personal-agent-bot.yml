name: Diagnose Personal Agent Bot

on:
  workflow_dispatch:
  push:
    branches: [cursor/personal-agent-task-scheduler-64cf]
    paths:
      - '.github/workflows/diagnose-personal-agent-bot.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ORACLE_SSH_KEY }}

      - name: Deep diagnose and fix personal-agent bot
        run: |
          HOST="${{ secrets.ORACLE_HOST || '140.84.183.154' }}"
          USER="${{ secrets.ORACLE_SSH_USER || 'ubuntu' }}"
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -o StrictHostKeyChecking=no "${USER}@${HOST}" '
            set -e
            cd /opt/personal-agent

            echo "=== CONTAINERS ==="
            sudo docker compose -f docker-compose.prod.yml ps -a

            echo "=== TELEGRAM WEBHOOK / CONFLICT CHECK ==="
            python3 - <<'"'"'PY'"'"'
            from pathlib import Path
            import json, urllib.request

            token = None
            for line in Path(".env").read_text(encoding="utf-8").splitlines():
                if line.startswith("BOT_TOKEN="):
                    token = line.split("=", 1)[1].strip()
                    break
            if not token:
                print("ERROR: BOT_TOKEN missing in .env")
            else:
                for method in ("getMe", "getWebhookInfo"):
                    url = f"https://api.telegram.org/bot{token}/{method}"
                    try:
                        with urllib.request.urlopen(url, timeout=15) as resp:
                            data = json.loads(resp.read().decode())
                        if method == "getMe":
                            r = data.get("result", {})
                            print(f"getMe: @{r.get('username')} id={r.get('id')} name={r.get('first_name')!r}")
                        else:
                            r = data.get("result", {})
                            print(f"webhook url={r.get('url')!r} pending={r.get('pending_update_count')}")
                            if r.get("url"):
                                print("WARNING: webhook is set — polling will not receive updates!")
                    except Exception as exc:
                        print(f"{method} failed: {exc}")
            PY

            echo "=== RECENT BOT LOGS (200 lines, errors highlighted) ==="
            sudo docker compose -f docker-compose.prod.yml logs bot --tail 200 2>&1 | grep -iE "error|exception|conflict|traceback|polling|handled|warning|freeze|locked" || true
            echo "--- full tail ---"
            sudo docker compose -f docker-compose.prod.yml logs bot --tail 60

            echo "=== FORCE RECREATE BOT (drop pending updates) ==="
            sudo docker compose -f docker-compose.prod.yml up -d --force-recreate bot
            sleep 15

            echo "=== AFTER RECREATE ==="
            sudo docker compose -f docker-compose.prod.yml ps -a
            sudo docker compose -f docker-compose.prod.yml logs bot --tail 40

            if sudo docker compose -f docker-compose.prod.yml logs bot 2>&1 | grep -qi "conflict"; then
              echo "::error::TelegramConflictError — another instance is polling the same token"
              exit 1
            fi
            if ! sudo docker compose -f docker-compose.prod.yml logs bot 2>&1 | grep -q "Start polling"; then
              echo "::error::Bot not polling after recreate"
              exit 1
            fi
            echo "DIAGNOSE OK — bot polling"
          '
