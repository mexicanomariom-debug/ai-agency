name: Deploy to Oracle

on:
  push:
    branches: [cursor/language-tutor-recreate-a360, main]
    paths:
      - 'language-tutor/**'
      - '.github/workflows/deploy-oracle.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ORACLE_SSH_KEY }}

      - name: Add Oracle host key
        run: |
          HOST="${{ secrets.ORACLE_HOST || '140.84.183.154' }}"
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Create production .env
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'opus5_prod_secret_2026' }}
          API_SECRET_KEY: ${{ secrets.API_SECRET_KEY || 'opus5-api-secret-2026' }}
        run: |
          if [ -z "$OPENAI_API_KEY" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Need OPENAI_API_KEY and/or ANTHROPIC_API_KEY in GitHub Secrets."
            exit 1
          fi
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::warning::OPENAI_API_KEY empty — Whisper STT/TTS disabled. Anthropic chat + browser speech will be used."
          fi
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY empty — replies will use OpenAI chat if available."
          fi
          cat > language-tutor/.env <<EOF
          BOT_TOKEN=${BOT_TOKEN}
          BOT_USERNAME=All_languages_bot
          OPENAI_API_KEY=${OPENAI_API_KEY}
          OPENAI_MODEL=gpt-4o-mini
          OPENAI_TTS_VOICE=onyx
          ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
          ANTHROPIC_MODEL=claude-sonnet-5
          POSTGRES_USER=language_tutor
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_DB=language_tutor
          DATABASE_URL=postgresql+asyncpg://language_tutor:${POSTGRES_PASSWORD}@db:5432/language_tutor
          TWA_URL=https://webapp-bay-three-75.vercel.app
          WEBAPP_URL=https://webapp-bay-three-75.vercel.app
          CORS_ORIGINS=https://webapp-bay-three-75.vercel.app
          API_HOST=0.0.0.0
          API_PORT=8000
          API_SECRET_KEY=${API_SECRET_KEY}
          DEMO_MODE=true
          ENVIRONMENT=production
          EOF
          sed -i 's/^          //' language-tutor/.env
          echo "OPENAI_API_KEY length: ${#OPENAI_API_KEY}"
          echo "ANTHROPIC_API_KEY length: ${#ANTHROPIC_API_KEY}"

      - name: Deploy to Oracle
        run: |
          HOST="${{ secrets.ORACLE_HOST || '140.84.183.154' }}"
          USER="${{ secrets.ORACLE_SSH_USER || 'ubuntu' }}"
          REMOTE_DIR="/opt/opus5"

          deploy_to() {
            local server="$1"
            tar -czf /tmp/opus5-deploy.tar.gz \
              --exclude=node_modules --exclude=.next --exclude=__pycache__ --exclude=.venv --exclude=.git \
              -C language-tutor .
            scp -o StrictHostKeyChecking=no /tmp/opus5-deploy.tar.gz "$server:/tmp/opus5-deploy.tar.gz"
            ssh -o StrictHostKeyChecking=no "$server" "sudo mkdir -p $REMOTE_DIR && sudo chown -R \$(whoami):\$(whoami) $REMOTE_DIR"
            scp -o StrictHostKeyChecking=no language-tutor/.env "$server:$REMOTE_DIR/.env"
            ssh -o StrictHostKeyChecking=no "$server" "cd $REMOTE_DIR && tar -xzf /tmp/opus5-deploy.tar.gz && rm -f /tmp/opus5-deploy.tar.gz && chmod +x oracle-redeploy.sh oracle-setup.sh && ./oracle-redeploy.sh"
          }

          if deploy_to "${USER}@${HOST}"; then
            echo "Deployed as ${USER}@${HOST}"
          elif [ "$USER" = "ubuntu" ]; then
            echo "ubuntu deploy failed"
            exit 1
          else
            exit 1
          fi

      - name: Open TCP 8000 on VM firewall
        run: |
          sleep 20
          HOST="${{ secrets.ORACLE_HOST || '140.84.183.154' }}"
          USER="${{ secrets.ORACLE_SSH_USER || 'ubuntu' }}"
          ssh -o StrictHostKeyChecking=no "${USER}@${HOST}" '
            set -e
            if command -v ufw >/dev/null; then
              sudo ufw allow 8000/tcp || true
            fi
            sudo iptables -C INPUT -p tcp --dport 8000 -j ACCEPT 2>/dev/null || \
              sudo iptables -I INPUT -p tcp --dport 8000 -j ACCEPT
            # Persist if iptables-persistent / netfilter-persistent exists
            sudo netfilter-persistent save 2>/dev/null || \
              sudo service netfilter-persistent save 2>/dev/null || \
              sudo iptables-save | sudo tee /etc/iptables/rules.v4 >/dev/null 2>/dev/null || true
            echo "=== listen ==="
            sudo ss -tlnp | grep 8000 || true
            echo "=== local health ==="
            curl -sf http://127.0.0.1:8000/health
            echo
          '

      - name: Health check
        run: |
          sleep 8
          HOST="${{ secrets.ORACLE_HOST || '140.84.183.154' }}"
          if curl -sf --max-time 10 "http://${HOST}:8000/health"; then
            echo
            echo "EXTERNAL OK — TCP 8000 reachable"
          else
            echo "EXTERNAL FAIL — open Ingress TCP 8000 in Oracle Cloud Security List (0.0.0.0/0)"
            echo "::warning::VM firewall may be open but Oracle Security List still blocks port 8000"
          fi

      - name: Bot logs after deploy
        run: |
          HOST="${{ secrets.ORACLE_HOST || '140.84.183.154' }}"
          USER="${{ secrets.ORACLE_SSH_USER || 'ubuntu' }}"
          ssh -o StrictHostKeyChecking=no "${USER}@${HOST}" "
            cd /opt/opus5
            sudo docker compose -f docker-compose.prod.yml logs bot --tail 30
          "
