name: Deploy to Oracle

on:
  push:
    branches: [cursor/language-tutor-recreate-a360, main]
    paths:
      - 'language-tutor/**'
      - '.github/workflows/deploy-oracle.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ORACLE_SSH_KEY }}

      - name: Add Oracle host key
        run: |
          HOST="${{ secrets.ORACLE_HOST || '140.84.183.154' }}"
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Create production .env
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'opus5_prod_secret_2026' }}
          API_SECRET_KEY: ${{ secrets.API_SECRET_KEY || 'opus5-api-secret-2026' }}
        run: |
          cat > language-tutor/.env <<EOF
          BOT_TOKEN=${BOT_TOKEN}
          BOT_USERNAME=All_languages_bot
          OPENAI_API_KEY=${OPENAI_API_KEY}
          OPENAI_MODEL=gpt-4o-mini
          POSTGRES_USER=language_tutor
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_DB=language_tutor
          DATABASE_URL=postgresql+asyncpg://language_tutor:${POSTGRES_PASSWORD}@db:5432/language_tutor
          TWA_URL=https://webapp-bay-three-75.vercel.app
          WEBAPP_URL=https://webapp-bay-three-75.vercel.app
          CORS_ORIGINS=https://webapp-bay-three-75.vercel.app
          API_HOST=0.0.0.0
          API_PORT=8000
          API_SECRET_KEY=${API_SECRET_KEY}
          DEMO_MODE=true
          ENVIRONMENT=production
          EOF
          sed -i 's/^          //' language-tutor/.env

      - name: Deploy to Oracle
        run: |
          HOST="${{ secrets.ORACLE_HOST || '140.84.183.154' }}"
          USER="${{ secrets.ORACLE_SSH_USER || 'ubuntu' }}"
          REMOTE_DIR="/opt/opus5"

          deploy_to() {
            local server="$1"
            tar -czf /tmp/opus5-deploy.tar.gz \
              --exclude=node_modules --exclude=.next --exclude=__pycache__ --exclude=.venv --exclude=.git \
              -C language-tutor .
            scp -o StrictHostKeyChecking=no /tmp/opus5-deploy.tar.gz "$server:/tmp/opus5-deploy.tar.gz"
            scp -o StrictHostKeyChecking=no language-tutor/.env "$server:$REMOTE_DIR/.env"
            ssh -o StrictHostKeyChecking=no "$server" bash -s <<REMOTE
          set -euo pipefail
          sudo mkdir -p $REMOTE_DIR
          sudo chown -R \$(whoami):\$(whoami) $REMOTE_DIR
          cd $REMOTE_DIR
          tar -xzf /tmp/opus5-deploy.tar.gz
          rm -f /tmp/opus5-deploy.tar.gz
          chmod +x oracle-redeploy.sh oracle-setup.sh
          ./oracle-redeploy.sh
          REMOTE
          }

          if deploy_to "${USER}@${HOST}"; then
            echo "Deployed as ${USER}@${HOST}"
          elif [ "$USER" = "ubuntu" ]; then
            echo "ubuntu failed, trying opc..."
            deploy_to "opc@${HOST}"
          else
            exit 1
          fi

      - name: Health check
        run: |
          sleep 15
          curl -sf "http://${{ secrets.ORACLE_HOST || '140.84.183.154' }}:8000/health" || echo "Health check failed (firewall may block GitHub Actions IP)"
