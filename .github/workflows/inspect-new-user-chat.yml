name: Inspect New User Chat

on:
  push:
    branches:
      - cursor/inspect-new-user-chat-c023
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ORACLE_SSH_KEY }}
      - name: Verify prod voice fix deployed
        run: |
          HOST="${{ secrets.ORACLE_HOST || '140.84.183.154' }}"
          USER="${{ secrets.ORACLE_SSH_USER || 'ubuntu' }}"
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -o StrictHostKeyChecking=no "${USER}@${HOST}" "cd /opt/opus5 && \
          echo '=== CONTAINERS ===' && sudo docker compose -f docker-compose.prod.yml ps && \
          echo '=== DISPATCHER ===' && sudo docker compose -f docker-compose.prod.yml exec -T bot sed -n '20,45p' /app/bot/dispatcher.py && \
          echo '=== PLACEMENT ===' && sudo docker compose -f docker-compose.prod.yml exec -T bot sed -n '110,130p' /app/bot/handlers/placement.py && \
          echo '=== WHISPER PROMPT MODULE ===' && (sudo docker compose -f docker-compose.prod.yml exec -T bot test -f /app/services/whisper_prompt.py && echo present || echo MISSING) && \
          echo '=== VOICE ECHO ===' && sudo docker compose -f docker-compose.prod.yml exec -T bot grep -n 'whisper_prompt_for\|📝' /app/bot/handlers/voice.py | head -20 && \
          echo '=== HEALTH ===' && curl -sS http://127.0.0.1:8000/health"
