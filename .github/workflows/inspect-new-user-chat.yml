name: Inspect New User Chat

on:
  push:
    branches:
      - cursor/inspect-new-user-chat-c023
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ORACLE_SSH_KEY }}
      - name: Marat today + prod placement/voice order
        run: |
          HOST="${{ secrets.ORACLE_HOST || '140.84.183.154' }}"
          USER="${{ secrets.ORACLE_SSH_USER || 'ubuntu' }}"
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -o StrictHostKeyChecking=no "${USER}@${HOST}" "cd /opt/opus5 && \
          echo '=== DISPATCHER ORDER ===' && \
          sudo docker compose -f docker-compose.prod.yml exec -T bot sed -n '1,80p' /app/bot/dispatcher.py && \
          echo '=== PLACEMENT CATCHALL ===' && \
          sudo docker compose -f docker-compose.prod.yml exec -T bot sed -n '90,110p' /app/bot/handlers/placement.py && \
          echo '=== MARAT TODAY ===' && \
          sudo docker compose -f docker-compose.prod.yml exec -T db psql -U language_tutor -d language_tutor -At -F '|' -c \"SELECT id, created_at, role, left(replace(content, chr(10), ' / '), 240) FROM chat_messages WHERE user_id=1 AND created_at >= '2026-08-08' ORDER BY id;\" && \
          echo '=== PHILL AFTER 13:17 ===' && \
          sudo docker compose -f docker-compose.prod.yml exec -T db psql -U language_tutor -d language_tutor -At -F '|' -c \"SELECT id, created_at, role, left(replace(content, chr(10), ' / '), 240) FROM chat_messages WHERE user_id=4 AND created_at >= '2026-08-08 13:17:00' ORDER BY id;\""
