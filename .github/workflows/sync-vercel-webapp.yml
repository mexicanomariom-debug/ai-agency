name: Sync Vercel Webapp Branch

on:
  push:
    branches: [main]
    paths:
      - 'language-tutor/webapp/**'
      - '.github/workflows/sync-vercel-webapp.yml'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push webapp-only branch for Vercel
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/webapp-sync
          cp -r language-tutor/webapp/. /tmp/webapp-sync/
          rm -rf /tmp/webapp-sync/node_modules /tmp/webapp-sync/.next

          git fetch origin vercel-webapp 2>/dev/null || true
          git checkout -B vercel-webapp

          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -r /tmp/webapp-sync/. .

          git add -A
          if git diff --staged --quiet; then
            echo "vercel-webapp branch already up to date"
            exit 0
          fi

          git commit -m "Sync webapp from main"
          git push -f origin vercel-webapp

      - name: Trigger Vercel deploy hook
        if: ${{ secrets.VERCEL_DEPLOY_HOOK != '' }}
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
