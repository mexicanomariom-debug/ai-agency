name: Deploy ai-ege from Oracle /opt

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-ai-ege-from-oracle.yml'
  workflow_dispatch:

concurrency:
  group: deploy-ai-ege-from-oracle
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ORACLE_SSH_KEY }}

      - name: Add Oracle host key
        run: |
          HOST="${{ secrets.ORACLE_HOST || '140.84.183.154' }}"
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Inspect project
        run: |
          HOST="${{ secrets.ORACLE_HOST || '140.84.183.154' }}"
          USER="${{ secrets.ORACLE_SSH_USER || 'ubuntu' }}"
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 "${USER}@${HOST}" 'bash -s' <<'EOS'
          set -e
          echo "=== /opt/ai-ege-tutor-bot ==="
          ls -la /opt/ai-ege-tutor-bot | head -40
          echo "=== key files ==="
          ls -la /opt/ai-ege-tutor-bot/docker-compose*.yml /opt/ai-ege-tutor-bot/oracle-redeploy.sh /opt/ai-ege-tutor-bot/requirements.txt /opt/ai-ege-tutor-bot/Dockerfile /opt/ai-ege-tutor-bot/bot/main.py /opt/ai-ege-tutor-bot/main.py 2>/dev/null || true
          find /opt/ai-ege-tutor-bot -maxdepth 3 -type f \( -name "*.py" -o -name "docker-compose*.yml" -o -name "Dockerfile" -o -name "package.json" \) 2>/dev/null | head -50
          echo "=== .env KEYS ==="
          [ -f /opt/ai-ege-tutor-bot/.env ] && cut -d= -f1 /opt/ai-ege-tutor-bot/.env | sed 's/^/KEY: /' || echo "no .env"
          echo "=== docker ps ==="
          sudo docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Image}}" | head -20
          EOS

      - name: Resolve token and restart bot
        env:
          REPETITORS_BOT_TOKEN: ${{ secrets.REPETITORS_BOT_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          HOST="${{ secrets.ORACLE_HOST || '140.84.183.154' }}"
          USER="${{ secrets.ORACLE_SSH_USER || 'ubuntu' }}"
          SERVER="${USER}@${HOST}"

          is_ok() {
            local t="$1"
            [ -n "$t" ] || return 1
            curl -sS --max-time 15 "https://api.telegram.org/bot${t}/getMe" | grep -q '"ok":true'
          }
          is_rep() {
            local t="$1"
            curl -sS --max-time 15 "https://api.telegram.org/bot${t}/getMe" | grep -q 'repetitors_ai_bot'
          }

          TOKEN=""
          if is_rep "${REPETITORS_BOT_TOKEN:-}"; then TOKEN="$REPETITORS_BOT_TOKEN"; echo "token=REPETITORS_BOT_TOKEN"; fi
          if [ -z "$TOKEN" ]; then
            while IFS= read -r c; do
              [ -z "$c" ] && continue
              if is_rep "$c"; then TOKEN="$c"; echo "token=server_repetitors"; break; fi
            done < <(ssh -o StrictHostKeyChecking=no "$SERVER" "grep -E '^(BOT_TOKEN|TELEGRAM_BOT_TOKEN)=' /opt/ai-ege-tutor-bot/.env 2>/dev/null | cut -d= -f2- | tr -d '\r'")
          fi
          if [ -z "$TOKEN" ] && is_rep "${BOT_TOKEN:-}"; then TOKEN="$BOT_TOKEN"; echo "token=BOT_TOKEN"; fi
          if [ -z "$TOKEN" ]; then
            while IFS= read -r c; do
              [ -z "$c" ] && continue
              if is_ok "$c"; then TOKEN="$c"; echo "token=any_valid"; break; fi
            done < <(ssh -o StrictHostKeyChecking=no "$SERVER" "grep -E '^(BOT_TOKEN|TELEGRAM_BOT_TOKEN)=' /opt/ai-ege-tutor-bot/.env 2>/dev/null | cut -d= -f2- | tr -d '\r'")
          fi

          if [ -z "$TOKEN" ]; then
            echo "::error::No valid bot token. On PC run:"
            echo '  $t=(Get-Content "C:\Users\DavidPC\Projects\ai-ege-tutor-bot 2\ai-ege-tutor-bot\.env"|?{$_ -match "^BOT_TOKEN="}) -replace "^BOT_TOKEN=",""'
            echo '  $t | gh secret set REPETITORS_BOT_TOKEN'
            exit 1
          fi

          ME=$(curl -sS "https://api.telegram.org/bot${TOKEN}/getMe")
          echo "getMe: ${ME:0:200}"
          if ! echo "$ME" | grep -q repetitors_ai_bot; then
            echo "::warning::Not @repetitors_ai_bot — set REPETITORS_BOT_TOKEN"
          fi

          # Write token to a temp file on server, then restart without full --build first
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 "$SERVER" "bash -s" <<EOS
          set -euo pipefail
          TOKEN='${TOKEN}'
          SRC=/opt/ai-ege-tutor-bot
          cd "\$SRC"
          if [ -f .env ]; then
            if grep -q '^BOT_TOKEN=' .env; then sed -i "s/^BOT_TOKEN=.*/BOT_TOKEN=\${TOKEN}/" .env
            else echo "BOT_TOKEN=\${TOKEN}" >> .env; fi
            if grep -q '^TELEGRAM_BOT_TOKEN=' .env; then sed -i "s/^TELEGRAM_BOT_TOKEN=.*/TELEGRAM_BOT_TOKEN=\${TOKEN}/" .env; fi
            if grep -q '^BOT_USERNAME=' .env; then sed -i 's/^BOT_USERNAME=.*/BOT_USERNAME=repetitors_ai_bot/' .env
            else echo 'BOT_USERNAME=repetitors_ai_bot' >> .env; fi
          else
            printf 'BOT_TOKEN=%s\nBOT_USERNAME=repetitors_ai_bot\n' "\$TOKEN" > .env
          fi

          echo "=== restart (no rebuild first) ==="
          if [ -f docker-compose.prod.yml ]; then
            sudo docker compose -f docker-compose.prod.yml up -d --timeout 60
            sudo docker compose -f docker-compose.prod.yml restart || true
            sleep 12
            sudo docker compose -f docker-compose.prod.yml ps
            sudo docker compose -f docker-compose.prod.yml logs --tail 40
          elif [ -f docker-compose.yml ]; then
            sudo docker compose up -d --timeout 60
            sudo docker compose restart || true
            sleep 12
            sudo docker compose ps
            sudo docker compose logs --tail 40
          elif [ -f oracle-redeploy.sh ]; then
            chmod +x oracle-redeploy.sh
            timeout 180 ./oracle-redeploy.sh || ./oracle-redeploy.sh
          else
            echo "No compose — listing for manual wiring"
            ls -la
            exit 1
          fi
          EOS
