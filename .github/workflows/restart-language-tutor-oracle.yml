name: Restart Language Tutor on Oracle

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/personal-agent-task-scheduler-64cf
      - cursor/repetitor-projects-align-64cf
      - main
    paths:
      - 'language-tutor/**'
      - '.github/workflows/restart-language-tutor-oracle.yml'

concurrency:
  group: deploy-language-tutor-oracle
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ORACLE_SSH_KEY }}

      - name: Add Oracle host key
        run: |
          HOST="${{ secrets.ORACLE_HOST || '140.84.183.154' }}"
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Resolve @repetitors_ai_bot token
        id: resolve
        env:
          REPETITORS_BOT_TOKEN: ${{ secrets.REPETITORS_BOT_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          set -euo pipefail
          HOST="${{ secrets.ORACLE_HOST || '140.84.183.154' }}"
          USER="${{ secrets.ORACLE_SSH_USER || 'ubuntu' }}"

          pick_token() {
            local t="$1"
            [ -z "$t" ] && return 1
            local me
            me=$(curl -sS --max-time 15 "https://api.telegram.org/bot${t}/getMe" || true)
            if echo "$me" | grep -q 'repetitors_ai_bot'; then
              echo "$t" > /tmp/repetitors_bot_token
              echo "Resolved @repetitors_ai_bot from CI env"
              return 0
            fi
            return 1
          }

          TOKEN=""
          if [ -n "${REPETITORS_BOT_TOKEN:-}" ]; then pick_token "$REPETITORS_BOT_TOKEN" && TOKEN=ok; fi
          if [ -z "$TOKEN" ] && [ -n "${BOT_TOKEN:-}" ]; then pick_token "$BOT_TOKEN" && TOKEN=ok; fi

          if [ -z "$TOKEN" ]; then
            echo "Searching server Projects/.env for @repetitors_ai_bot token..."
            scp -o StrictHostKeyChecking=no language-tutor/scripts/resolve-repetitors-token.sh "${USER}@${HOST}:/tmp/resolve-repetitors-token.sh"
            ssh -o StrictHostKeyChecking=no "${USER}@${HOST}" 'chmod +x /tmp/resolve-repetitors-token.sh && /tmp/resolve-repetitors-token.sh' > /tmp/repetitors_bot_token || true
            if [ -s /tmp/repetitors_bot_token ]; then
              echo "Resolved @repetitors_ai_bot from server Projects/.env"
            fi
          fi

          if [ ! -s /tmp/repetitors_bot_token ]; then
            echo "=== Server .env search (diagnostic) ==="
            ssh -o StrictHostKeyChecking=no "${USER}@${HOST}" '
              ls -la /home/ubuntu/ 2>/dev/null || true
              ls -la /home/ubuntu/Projects 2>/dev/null || echo "no /home/ubuntu/Projects"
              find /home/ubuntu -maxdepth 4 -name ".env" 2>/dev/null | head -30 || true
            ' || true
            echo "::error::No @repetitors_ai_bot token. Add GitHub secret REPETITORS_BOT_TOKEN or copy .env to server /home/ubuntu/Projects/opus5/.env"
            exit 1
          fi

          ME=$(curl -sS "https://api.telegram.org/bot$(cat /tmp/repetitors_bot_token)/getMe")
          echo "getMe: ${ME:0:120}..."

      - name: Create production .env
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'opus5_prod_secret_2026' }}
          API_SECRET_KEY: ${{ secrets.API_SECRET_KEY || 'opus5-api-secret-2026' }}
        run: |
          BOT_TOKEN=$(cat /tmp/repetitors_bot_token)
          cat > language-tutor/.env <<EOF
          BOT_TOKEN=${BOT_TOKEN}
          BOT_USERNAME=repetitors_ai_bot
          OPENAI_API_KEY=${OPENAI_API_KEY}
          OPENAI_MODEL=gpt-4o
          OPENAI_TTS_VOICE=shimmer
          OPENAI_TTS_MODEL=tts-1-hd
          ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
          ANTHROPIC_MODEL=claude-sonnet-5
          POSTGRES_USER=language_tutor
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_DB=language_tutor
          DATABASE_URL=postgresql+asyncpg://language_tutor:${POSTGRES_PASSWORD}@db:5432/language_tutor
          TWA_URL=https://webapp-bay-three-75.vercel.app
          WEBAPP_URL=https://webapp-bay-three-75.vercel.app
          CORS_ORIGINS=https://webapp-bay-three-75.vercel.app
          API_HOST=0.0.0.0
          API_PORT=8000
          API_SECRET_KEY=${API_SECRET_KEY}
          DEMO_MODE=true
          ENVIRONMENT=production
          EOF
          sed -i 's/^          //' language-tutor/.env

      - name: Deploy language-tutor to Oracle
        run: |
          HOST="${{ secrets.ORACLE_HOST || '140.84.183.154' }}"
          USER="${{ secrets.ORACLE_SSH_USER || 'ubuntu' }}"
          REMOTE_DIR="/opt/opus5"

          tar -czf /tmp/opus5-deploy.tar.gz \
            --exclude=node_modules --exclude=.next --exclude=__pycache__ --exclude=.venv --exclude=.git \
            -C language-tutor .

          scp -o StrictHostKeyChecking=no /tmp/opus5-deploy.tar.gz "$USER@$HOST:/tmp/opus5-deploy.tar.gz"
          ssh -o StrictHostKeyChecking=no "$USER@$HOST" "sudo mkdir -p $REMOTE_DIR && sudo chown -R \$(whoami):\$(whoami) $REMOTE_DIR"
          scp -o StrictHostKeyChecking=no language-tutor/.env "$USER@$HOST:$REMOTE_DIR/.env"
          ssh -o StrictHostKeyChecking=no "$USER@$HOST" "
            cd $REMOTE_DIR
            tar -xzf /tmp/opus5-deploy.tar.gz
            rm -f /tmp/opus5-deploy.tar.gz
            chmod +x oracle-redeploy.sh oracle-setup.sh
            ./oracle-redeploy.sh
          "

      - name: Verify @repetitors_ai_bot is running
        run: |
          HOST="${{ secrets.ORACLE_HOST || '140.84.183.154' }}"
          USER="${{ secrets.ORACLE_SSH_USER || 'ubuntu' }}"
          ssh -o StrictHostKeyChecking=no "${USER}@${HOST}" '
            cd /opt/opus5
            sudo docker compose -f docker-compose.prod.yml ps -a
            TOKEN=$(grep "^BOT_TOKEN=" .env | cut -d= -f2-)
            ME=$(curl -sS "https://api.telegram.org/bot${TOKEN}/getMe")
            echo "getMe: $ME" | head -c 400
            echo
            if ! echo "$ME" | grep -q "repetitors_ai_bot"; then
              echo "::error::BOT_TOKEN is not @repetitors_ai_bot"
              exit 1
            fi
            for i in 1 2 3 4 5 6; do
              if sudo docker compose -f docker-compose.prod.yml logs bot 2>&1 | grep -q "Start polling"; then
                echo "@repetitors_ai_bot polling confirmed"
                sudo docker compose -f docker-compose.prod.yml logs bot --tail 15
                exit 0
              fi
              sleep 10
            done
            sudo docker compose -f docker-compose.prod.yml logs bot --tail 30
            if sudo docker compose -f docker-compose.prod.yml logs bot 2>&1 | grep -qi "TelegramConflictError"; then
              echo "::error::TelegramConflictError — stop duplicate @repetitors_ai_bot elsewhere"
            fi
            echo "::error::@repetitors_ai_bot failed to start polling"
            exit 1
          '

      - name: Restart personal-agent (@mychatbot7_bot)
        run: |
          HOST="${{ secrets.ORACLE_HOST || '140.84.183.154' }}"
          USER="${{ secrets.ORACLE_SSH_USER || 'ubuntu' }}"
          ssh -o StrictHostKeyChecking=no "${USER}@${HOST}" '
            if [ -d /opt/personal-agent ]; then
              cd /opt/personal-agent
              sudo docker compose -f docker-compose.prod.yml up -d
              sudo docker compose -f docker-compose.prod.yml restart bot oauth
              sleep 8
              if sudo docker compose -f docker-compose.prod.yml logs bot 2>&1 | grep -q "Start polling"; then
                echo "@mychatbot7_bot polling OK"
              else
                echo "::warning::personal-agent not polling — run Deploy Personal Agent workflow"
              fi
            fi
          '
