name: Fix Personal Agent Bot Conflict

on:
  workflow_dispatch:

concurrency:
  group: deploy-personal-agent-oracle
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ORACLE_SSH_KEY }}

      - name: Stop conflicting bots and restart personal-agent
        run: |
          HOST="${{ secrets.ORACLE_HOST || '140.84.183.154' }}"
          USER="${{ secrets.ORACLE_SSH_USER || 'ubuntu' }}"
          ssh -o StrictHostKeyChecking=no "${USER}@${HOST}" '
            set -e
            echo "=== Docker containers (before) ==="
            sudo docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"

            if [ -d /opt/opus5 ]; then
              echo "=== Stopping /opt/opus5 (language-tutor) ==="
              cd /opt/opus5
              sudo docker compose -f docker-compose.prod.yml down --remove-orphans 2>/dev/null || true
            fi

            sudo docker rm -f opus5-bot opus5-api language-tutor-bot 2>/dev/null || true
            pkill -f "[p]ython -m bot.main" 2>/dev/null || true

            echo "=== Restart personal-agent ==="
            cd /opt/personal-agent
            sudo docker compose -p personal-agent -f docker-compose.prod.yml restart bot
            sleep 5

            echo "=== Docker containers (after) ==="
            sudo docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"
            echo "=== personal-agent-bot logs ==="
            sudo docker logs personal-agent-bot --tail 30
          '
