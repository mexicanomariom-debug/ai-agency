name: Bot Status Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ORACLE_SSH_KEY }}

      - name: Check bot containers and logs
        run: |
          HOST="${{ secrets.ORACLE_HOST || '140.84.183.154' }}"
          USER="${{ secrets.ORACLE_SSH_USER || 'ubuntu' }}"
          ssh -o StrictHostKeyChecking=no "${USER}@${HOST}" "
            cd /opt/opus5
            sudo docker compose -f docker-compose.prod.yml ps
            echo '--- BOT LOGS ---'
            sudo docker compose -f docker-compose.prod.yml logs bot --tail 50
            echo '--- API LOGS ---'
            sudo docker compose -f docker-compose.prod.yml logs api --tail 20
          "
