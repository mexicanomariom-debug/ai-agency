name: Oracle Dropbox for ai-ege-tutor

# Creates /home/ubuntu/inbox/ai-ege-tutor-bot on Oracle and deploys if code is there.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oracle-inbox-ai-ege.yml'
      - 'scripts/do-all-ai-ege-deploy.ps1'
  workflow_dispatch:
    inputs:
      action:
        description: prepare_inbox | deploy_from_inbox
        required: true
        default: prepare_inbox
        type: choice
        options:
          - prepare_inbox
          - deploy_from_inbox

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ORACLE_SSH_KEY }}

      - name: Add Oracle host key
        run: |
          HOST="${{ secrets.ORACLE_HOST || '140.84.183.154' }}"
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Prepare inbox on Oracle
        if: github.event_name == 'push' || github.event.inputs.action == 'prepare_inbox'
        run: |
          HOST="${{ secrets.ORACLE_HOST || '140.84.183.154' }}"
          USER="${{ secrets.ORACLE_SSH_USER || 'ubuntu' }}"
          ssh -o StrictHostKeyChecking=no "${USER}@${HOST}" '
            mkdir -p /home/ubuntu/inbox/ai-ege-tutor-bot
            ls -la /home/ubuntu/inbox/
            echo "=== search for ege/tutor projects ==="
            find /home/ubuntu /opt -maxdepth 4 -type d \( -iname "*ege*" -o -iname "*repetitor*" -o -iname "*tutor*" \) 2>/dev/null | head -40
            echo "=== .env files ==="
            find /home/ubuntu /opt -maxdepth 4 -name ".env" 2>/dev/null | head -20
          '
          echo ""
          echo "Upload from your PC:"
          echo "  scp -i C:\\Users\\DavidPC\\.ssh\\oracle_key -r \"C:\\Users\\DavidPC\\Projects\\ai-ege-tutor-bot 2\\ai-ege-tutor-bot\\*\" ubuntu@140.84.183.154:/home/ubuntu/inbox/ai-ege-tutor-bot/"
          echo "Then run this workflow again with action=deploy_from_inbox"

      - name: Deploy from inbox
        if: github.event.inputs.action == 'deploy_from_inbox'
        env:
          REPETITORS_BOT_TOKEN: ${{ secrets.REPETITORS_BOT_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          HOST="${{ secrets.ORACLE_HOST || '140.84.183.154' }}"
          USER="${{ secrets.ORACLE_SSH_USER || 'ubuntu' }}"
          SERVER="${USER}@${HOST}"

          ssh -o StrictHostKeyChecking=no "$SERVER" '
            if [ ! -d /home/ubuntu/inbox/ai-ege-tutor-bot ] || [ -z "$(ls -A /home/ubuntu/inbox/ai-ege-tutor-bot 2>/dev/null)" ]; then
              echo "ERROR: inbox empty — upload project first"
              exit 1
            fi
            ls -la /home/ubuntu/inbox/ai-ege-tutor-bot | head -30
          '

          pick() {
            local t="$1"
            [ -z "$t" ] && return 1
            curl -sS --max-time 15 "https://api.telegram.org/bot${t}/getMe" | grep -q repetitors_ai_bot
          }
          TOKEN=""
          if pick "$REPETITORS_BOT_TOKEN"; then TOKEN="$REPETITORS_BOT_TOKEN"
          elif pick "$BOT_TOKEN"; then TOKEN="$BOT_TOKEN"
          else
            # try .env from inbox on server
            TOKEN=$(ssh -o StrictHostKeyChecking=no "$SERVER" 'grep -m1 "^BOT_TOKEN=" /home/ubuntu/inbox/ai-ege-tutor-bot/.env 2>/dev/null | cut -d= -f2-' || true)
            if ! pick "$TOKEN"; then
              echo "::error::No @repetitors_ai_bot token. Put .env in inbox or set REPETITORS_BOT_TOKEN secret"
              exit 1
            fi
          fi
          echo "Token OK"

          scp -o StrictHostKeyChecking=no scripts/oracle-redeploy-remote.sh "$SERVER:/tmp/oracle-redeploy-remote.sh"
          ssh -o StrictHostKeyChecking=no "$SERVER" "
            set -e
            REMOTE_DIR=/opt/opus5
            sudo mkdir -p \$REMOTE_DIR
            sudo chown -R \$(whoami):\$(whoami) \$REMOTE_DIR
            tar -czf /tmp/ai-ege-tutor-deploy.tar.gz -C /home/ubuntu/inbox/ai-ege-tutor-bot \
              --exclude=node_modules --exclude=.next --exclude=__pycache__ --exclude=.venv --exclude=.git .
            # write token into .env (keep other keys from inbox .env if present)
            if [ -f /home/ubuntu/inbox/ai-ege-tutor-bot/.env ]; then
              cp /home/ubuntu/inbox/ai-ege-tutor-bot/.env \$REMOTE_DIR/.env
            fi
            if grep -q '^BOT_TOKEN=' \$REMOTE_DIR/.env 2>/dev/null; then
              sed -i 's/^BOT_TOKEN=.*/BOT_TOKEN=${TOKEN}/' \$REMOTE_DIR/.env
            else
              echo 'BOT_TOKEN=${TOKEN}' >> \$REMOTE_DIR/.env
            fi
            grep -q '^BOT_USERNAME=' \$REMOTE_DIR/.env 2>/dev/null || echo 'BOT_USERNAME=repetitors_ai_bot' >> \$REMOTE_DIR/.env
            sed -i 's/^BOT_USERNAME=.*/BOT_USERNAME=repetitors_ai_bot/' \$REMOTE_DIR/.env
            chmod +x /tmp/oracle-redeploy-remote.sh
            bash /tmp/oracle-redeploy-remote.sh \$REMOTE_DIR
          "

          ssh -o StrictHostKeyChecking=no "$SERVER" '
            TOKEN=$(grep "^BOT_TOKEN=" /opt/opus5/.env | cut -d= -f2-)
            curl -sS "https://api.telegram.org/bot${TOKEN}/getMe" | head -c 250
            echo
          '
